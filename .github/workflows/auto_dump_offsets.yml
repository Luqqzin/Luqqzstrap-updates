name: Auto Sync Roblox FastFlags Offsets

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Offset Sync Engine
        run: |
          python scripts/dumper/auto_updater.py

      - name: Commit and Push Updated Offsets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/FFlags.hpp src/data/FFlags_baseline.hpp src/data/FFlags_baseline.hpp.gz src/data/PCDesktopClient.json src/data/PCDesktopClient.json.gz
          if git diff --staged --quiet; then
            echo "No new offset changes to commit."
          else
            git commit -m "chore(offsets): auto-sync latest Roblox offsets & definitions [skip ci]"
            git push
          fi
